<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Players Card</title>

<style>
body {
  font-family: Arial;
  background-image:url("https://png.pngtree.com/thumb_back/fh260/background/20231017/pngtree-icc-cricket-world-match-background-image_13943187.jpg");
  background-size: cover;
  background-repeat: no-repeat;
  padding: 20px;
}

.card {
  width: 250px;
  background: white;
  border-radius: 10px;
  margin: 15px;
  display: inline-block;
}


.card img {
  width: 100%;
  border-top-left-radius: 12px;
  border-top-right-radius: 12px;
}

.container {
  padding: 10px 15px;
}

.tag {
  background: black;
  color: white;
  padding: 3px;
  font-size: 12px;
}


.t2 { background: green; }
.t3 { background: orange; }

button {
  background: black;
  color: white;
  padding: 8px;
}


</style>
</head>

<body>

<h2 style="color:white;">Cricketers</h2>

<!-- Dhoni -->
<div class="card">
  <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRVRxdKgeIjk3rPZA0z7ULa_E-DFLI0JPqi2Q&s" style="width:100%">
  <div class="container">
    <div class="tag">Legend</div>
    <h4>MS Dhoni</h4>
    <p>Captain Cool. One of the greatest finishers in cricket history.</p>
    <button>View Profile</button>
  </div>
</div>

<!-- Ruturaj -->
<div class="card">
  <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS0Qv9xV3NytiZpSOv8lZBa7TnL4ioyAvmZFg&s" style="width:100%">
  <div class="container">
    <div class="tag t2">CSK Star</div>
    <h4>Ruturaj Gaikwad</h4>
    <p>Stylish opener known for timing, consistency and calm batting.</p>
    <button>View Profile</button>
  </div>
</div>

<!-- Kohli -->
<div class="card">
  <img src="https://dy3rma73kowlp.cloudfront.net/uploads/2025/04/Cricket-2025-04-09T143610.382.jpg" style="width:100%">
  <div class="container">
    <div class="tag t3">Goat</div>
    <h4>Virat Kohli</h4>
    <p>King Kohli — modern era’s chase master and fitness icon.</p>
    <button>View Profile</button>
  </div>
</div>
